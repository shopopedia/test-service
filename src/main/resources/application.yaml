server:
  port: 8081

spring:
  application:
    name: test-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shopopedia
    username: shopopedia_user
    password: shopopedia_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.springframework.jdbc: DEBUG
    org.hibernate.SQL: DEBUG